# Sirve el panel y reenvia el API al contenedor de la aplicacion.
#
# El panel se copia desde la imagen construida; el API va por /api para que el
# navegador no tenga que lidiar con CORS ni con dos origenes distintos.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un corte grande tarda en generar el PDF: el minuto por defecto se
        # queda corto y el usuario recibiria un 504 sin explicacion.
        proxy_read_timeout 300s;
    }

    location /salud {
        proxy_pass http://api:8000/salud;
    }

    # El panel es una sola pagina con rutas en el hash; cualquier ruta
    # desconocida devuelve el index en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
