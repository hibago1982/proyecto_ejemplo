[project]
name = "busint-alertas"
version = "0.1.0"
description = "BUSINT — Aplicacion de motores de alerta. Primer motor: cartera."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
planos = ["openpyxl>=3.1"]
bd = ["sqlalchemy>=2.0", "alembic>=1.13"]
postgres = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1", "sqlalchemy>=2.0", "alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
